        <h1>Gokan SRS — Master Japanese Vocabulary with Spaced Repetition</h1>

        <p>
          Gokan SRS is a free spaced repetition system designed for Japanese learners who are
          actively studying kanji. It surfaces vocabulary that uses only the kanji you already
          know, keeping your reading queue grounded in real, learnable material.
        </p>

        <p>
          Unlike general-purpose flashcard apps, Gokan is built around a kanji-ordered curriculum
          (KKLC / RTK compatible). Every word you review is readable with your current knowledge —
          no frustrating characters you haven't encountered yet.
        </p>

        <h2>Key Features</h2>
        <ul>
          <li><strong>Kanji-aware vocabulary queue</strong> — only words your kanji level can support</li>
          <li><strong>Spaced repetition</strong> — scientifically proven review scheduling</li>
          <li><strong>Reading and meaning reviews</strong> — paced independently to your rhythm</li>
          <li><strong>JLPT preparation</strong> — vocabulary aligned with N5 through N1 levels</li>
          <li><strong>Google Drive sync</strong> — progress backed up and accessible across devices</li>
          <li><strong>Completely free</strong> — no subscription, no ads</li>
        </ul>

        <h2>Who Is Gokan For?</h2>
        <p>
          Gokan works best as a companion tool alongside a structured kanji method. If you are
          working through a kanji textbook and want vocabulary to reinforce what you learn, Gokan
          fills that gap. It is especially valuable once you start reading native Japanese and need
          a reliable pipeline of new words.
        </p>

        <h2>How Spaced Repetition Works</h2>
        <p>
          Spaced repetition schedules reviews at increasing intervals based on how well you recall
          each item. Words you find easy are shown less frequently; words you struggle with come
          back sooner. Over time this produces durable, long-term retention with less total study
          time than traditional methods.
        </p>
