name: Deploy to AWS S3 + CloudFront

on:
  push:
    branches:
      - main
    paths:
      - 'apps/gokan-srs/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - 'apps/gokan-srs/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: # Allow manual trigger from GitHub UI

env:
  NODE_ENV: production

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun run --cwd apps/gokan-srs test

  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: test  # Only deploy if tests pass
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Build application
        run: bun run --cwd apps/gokan-srs build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync build to S3
        run: |
          # Static assets (JS, CSS, images, vocab data)
          # We use --delete to remove old hashed files (cleanup)
          # We use --size-only to speed up checks for unchanged hashed assets
          aws s3 sync apps/gokan-srs/dist/ s3://${{ vars.S3_BUCKET_NAME }}/ \
            --delete \
            --size-only \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html"

          # HTML (SPA entry points)
          # IMPORTANT: Removed --size-only because index.html size often doesn't change
          # (just hash string change), causing S3 sync to skip it!
          aws s3 sync apps/gokan-srs/dist/ s3://${{ vars.S3_BUCKET_NAME }}/ \
            --cache-control "public, max-age=0, must-revalidate" \
            --exclude "*" \
            --include "*.html"

      - name: Invalidate CloudFront cache
        run: |
          # Invalidate entry points and raw compiled datasets to guarantee sync.
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/index.html" "/" "/data/compiled/*"

      - name: Deployment summary
        run: |
          echo "## 🚀 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Website URL:** https://${{ secrets.CLOUDFRONT_DOMAIN_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "**CloudFront Distribution:** ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" >> $GITHUB_STEP_SUMMARY
          echo "**S3 Bucket:** ${{ secrets.S3_BUCKET_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "**Region:** ${{ secrets.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Files synced to S3" >> $GITHUB_STEP_SUMMARY
          echo "✅ CloudFront cache invalidated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Changes will be live in 1-3 minutes_" >> $GITHUB_STEP_SUMMARY
