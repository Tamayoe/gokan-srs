# Reusable deploy for BOTH apps to ONE environment: the gokan-srs SPA at the site root, and
# gokan-dictionary under /dictionary/.
#
# Why one workflow rather than one per app: both apps read the same compiled dataset from the
# same gokan-dataset submodule checkout, so a single checkout guarantees they ship from one
# dataset version. Two workflows could deploy the app from one commit and the dictionary from
# another, leaving an environment serving two apps built off different datasets.
#
# Why one workflow rather than one per environment: staging and production would otherwise hold
# two copies of this logic and drift apart, which is the same failure one level up. Callers pass
# only what actually differs (bucket, distribution, origin).

name: "Deploy: site"

# Set here, not in the callers: a reusable workflow does not inherit the caller's `env`.
# apps/gokan-srs/vite.config.ts keys off this to skip the vite-plugin-checker typecheck pass
# during a CI build (CI typechecks as its own step), so dropping it would change build behavior.
env:
  NODE_ENV: production

on:
  workflow_call:
    inputs:
      environment_name:
        description: 'Environment label used in the run summary, e.g. "production"'
        type: string
        required: true
      site_origin:
        description: 'Public origin, no trailing slash, e.g. "https://gokan-srs.com". Becomes the dictionary canonical/sitemap host.'
        type: string
        required: true
      s3_bucket:
        description: 'Destination S3 bucket name'
        type: string
        required: true
      aws_region:
        type: string
        required: true
      ref:
        description: 'Branch, tag or SHA to build. Defaults to the triggering ref.'
        type: string
        required: false
        default: ''
    secrets:
      aws_access_key_id:
        required: true
      aws_secret_access_key:
        required: true
      cloudfront_distribution_id:
        required: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          # One checkout, one submodule pin, therefore one dataset version for both apps.
          # gokan-dataset is public, so no extra credentials are needed.
          submodules: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Build gokan-srs
        run: bun run --cwd apps/gokan-srs build

      # Reads the same dataset/compiled/ tree the step above synced from, and bakes it into
      # ~39k static pages. VITE_SITE_ORIGIN is what makes staging emit staging canonicals
      # instead of claiming to be production.
      - name: Build gokan-dictionary
        env:
          VITE_SITE_ORIGIN: ${{ inputs.site_origin }}
        run: bun run --cwd apps/gokan-dictionary build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.aws_access_key_id }}
          aws-secret-access-key: ${{ secrets.aws_secret_access_key }}
          aws-region: ${{ inputs.aws_region }}

      - name: Sync gokan-srs to S3
        run: |
          # Hashed static assets and compiled data: long cache, prune stale keys.
          #
          # --exclude "dictionary/*" on the --delete pass is LOAD-BEARING. `aws s3 sync --delete`
          # removes everything in the destination that is absent from the source, and the
          # dictionary lives under that prefix in this same bucket - without this, every app
          # deploy would silently wipe all ~39k dictionary pages with no error reported.
          aws s3 sync apps/gokan-srs/dist/ s3://${{ inputs.s3_bucket }}/ \
            --delete \
            --size-only \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "dictionary/*"

          # HTML entry points: always revalidate. No --size-only, because index.html frequently
          # changes only its embedded asset hashes and keeps the same byte length.
          aws s3 sync apps/gokan-srs/dist/ s3://${{ inputs.s3_bucket }}/ \
            --cache-control "public, max-age=0, must-revalidate" \
            --exclude "*" \
            --include "*.html"

      - name: Sync gokan-dictionary to S3
        run: |
          # Scoped to the dictionary/ prefix, so its own --delete can only prune its own pages.
          #
          # Only this first pass carries --delete, and it excludes nothing: a --delete pass
          # combined with --exclude/--include would treat every filtered-out file as "absent from
          # the source" and delete it at the destination.
          aws s3 sync apps/gokan-dictionary/dist/ s3://${{ inputs.s3_bucket }}/dictionary/ \
            --delete \
            --size-only \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html"

          # Page HTML: revalidate every time, same reasoning as the app's entry points. This is
          # nearly the whole site (~39k files), so it does the bulk of the work here.
          aws s3 sync apps/gokan-dictionary/dist/ s3://${{ inputs.s3_bucket }}/dictionary/ \
            --cache-control "public, max-age=0, must-revalidate" \
            --exclude "*" \
            --include "*.html"

          # Two unhashed files the first pass just marked immutable for a year. Re-uploaded with
          # a short TTL so a dataset change actually reaches search and crawlers.
          aws s3 cp apps/gokan-dictionary/dist/data/search.json \
            s3://${{ inputs.s3_bucket }}/dictionary/data/search.json \
            --cache-control "public, max-age=3600"
          aws s3 cp apps/gokan-dictionary/dist/sitemap.xml \
            s3://${{ inputs.s3_bucket }}/dictionary/sitemap.xml \
            --cache-control "public, max-age=3600"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.cloudfront_distribution_id }} \
            --paths "/index.html" "/" "/data/compiled/*" "/dictionary/*"

      - name: Deployment summary
        run: |
          {
            echo "## Deploy: ${{ inputs.environment_name }}"
            echo ""
            echo "**Ref:** ${{ inputs.ref || github.ref_name }}"
            echo "**App:** ${{ inputs.site_origin }}/"
            echo "**Dictionary:** ${{ inputs.site_origin }}/dictionary/"
            echo "**Bucket:** ${{ inputs.s3_bucket }}"
            echo ""
            echo "Both apps built from the same checkout, so they share one dataset version."
            echo ""
            echo "_Live in 1-3 minutes after CloudFront invalidation._"
          } >> $GITHUB_STEP_SUMMARY
