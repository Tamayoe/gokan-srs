# Runs Claude to respond to human feedback on a PR: a submitted review that is
# not an approval, a PR-level comment, or an inline review comment. Fires only
# when a person leaves feedback.
name: Claude — address PR feedback

on:
  pull_request_review:
    types: [submitted]
  issue_comment:            # top-level PR comments (issue_comment fires for PRs too)
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  # One run per PR; a newer comment supersedes an in-flight one.
  group: claude-feedback-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  respond:
    # Gate each event type so we only run on real, actionable feedback from a
    # TRUSTED account. On a public repo anyone can comment/review, so we require
    # author_association to be a repo owner/member/collaborator — this both keeps
    # random users from driving the agent (prompt injection / resource abuse) and
    # excludes the agent's own bot comments (which are never MEMBER), preventing loops.
    #   - reviews: not an approval (changes requested / commented) + trusted author
    #   - comments: on a PR (not a plain issue) + trusted author
    if: >
      (github.event_name == 'pull_request_review' &&
        github.event.review.state != 'approved' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write       # OIDC exchange for the Claude GitHub App installation token
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # GitHub-side auth via the installed Claude GitHub App (see claude-implement-issue.yml).
          # The action resolves the PR context from the triggering event automatically;
          # the prompt tells it how to act on that feedback.
          prompt: |
            A reviewer left feedback on this PR. Read the review and all review/PR
            comments in context. For each actionable point, either:
              - make the change on the PR branch (following CLAUDE.md, keeping
                bun run typecheck / lint / test green), or
              - reply explaining why you disagree or need clarification.
            Push any code changes to the same branch and post a brief comment
            summarising how you addressed the feedback. Do not resolve threads you
            did not actually address.
          claude_args: "--model claude-sonnet-5 --max-turns 40 --allowedTools Bash,Edit,Write,Read,Glob,Grep"
