name: CI - gokan-dictionary

on:
  push:
    paths:
      - 'apps/gokan-dictionary/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/ci-gokan-dictionary.yml'
  pull_request:
    paths:
      - 'apps/gokan-dictionary/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/ci-gokan-dictionary.yml'
  workflow_dispatch:

jobs:
  build:
    name: Typecheck and Build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run --cwd apps/gokan-dictionary typecheck

      - name: Build
        run: bun run --cwd apps/gokan-dictionary build
